spring:
  application:
    name: backend-java
  datasource:
    # DB_HOSTの指定があればそれを使い、無ければ localhost を使うという記法
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # なんかここ毎回書き直さなきゃいけない。なんで？
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    # 署名用のシークレットキー
    secret: ${JWT_SECRET}
    # トークンの有効期限（ミリ秒）: 86400000 = 24時間
    expiration-ms: 86400000
